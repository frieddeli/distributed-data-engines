apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  labels:
    app: dockercoins
    role: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dockercoins
      role: webui
  template:
    metadata:
      labels:
        app: dockercoins
        role: webui
    spec:
      containers:
      - name: webui
        image: dockercoins/webui:v0.1
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  labels:
    app: dockercoins
    role: webui
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001
  selector:
    app: dockercoins
    role: webui
